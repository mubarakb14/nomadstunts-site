<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomad Stunts</title>
<meta name="description" content="Nomad Stunts — international action company established in 2000 by Taurus World Stunt Awards winner Zhaidarbek Kunguzhinov. Stunt coordinators, stunt performers, horse masters and riggers.">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
<header></header>
<section class="hero" id="top">
  <div class="hero-in">
    <div class="hero-l">
      <h1 class="mark"><img src="assets/logo.svg" alt="Nomad Stunts" width="167" height="76"></h1>
      <p data-i="hero_p"></p>
      <button class="play" id="play"><i></i><span data-i="watch"></span></button>
    </div>
    <div class="hero-r" id="slides">
      <div class="dots" id="dots"></div>
      <a href="#about" class="scroll" aria-label="Scroll"><span>SCROLL</span><svg viewBox="0 0 14 16" fill="none" stroke="#fff" stroke-width="1.6"><path d="M7 0v14M1 8l6 6 6-6"/></svg></a>
    </div>
  </div>
  <div class="hero-bar"></div>
</section>
<section class="intro" id="about">
  <div class="wrap">
    <h2 class="h title rv" data-i="intro_t"></h2>
    <p class="rv" data-i="intro_p"></p>
    <div class="stats rv" id="stats"></div>
    <div class="cta"><a class="btn" href="about.html" data-i="more_about"></a></div>
  </div>
</section>
<section class="services"><div class="wrap"><h2 class="h title rv" data-i="srv_t"></h2><div class="cards" id="cards"></div></div></section>
<section class="founder" id="founder"></section>
<section class="team"><div class="wrap">
  <h2 class="h title rv" data-i="team_t"></h2><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
  <div class="cta"><a class="btn" href="team.html" data-i="team_all"></a></div>
</div></section>
<section class="projects">
  <h2 class="h title rv" data-i="proj_t"></h2>
  <div class="reel" id="reel"></div>
  <div class="stars" id="stars"></div>
  <div class="cta" style="margin:0;padding:44px 0 64px;background:#111"><a class="btn" href="projects.html" data-i="proj_all"></a></div>
</section>
<footer id="footer"></footer>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
